# Probe the Segmentic services from outside, and publish the result here.
#
# Why this repository is public and separate from the product repository:
# GitHub Pages is not available for a private repository on a free plan, and
# the product repository is private and staying that way. Nothing in here is
# secret. The probe reads four public URLs and needs no credential at all,
# which is also why the workflow lives beside the page rather than pushing to
# it from somewhere else: no token to store, none to rotate, and none to expire
# quietly on the day the page is most wanted.
name: probe

on:
  schedule:
    # Every ten minutes, deliberately off the hour.
    #
    # This was */10, which fires at :00, and :00 is the worst minute to ask
    # for: GitHub says the schedule event is delayed under load and that load
    # peaks at the start of every hour, when every */5, */10, */15 and hourly
    # cron on the platform asks at once.
    #
    # How bad it was here, measured rather than assumed: in the three and a
    # half hours after this repository was created, a cron asking for a run
    # every ten minutes produced exactly one run. Every other measurement in
    # history.json had arrived from a push or from somebody pressing the
    # button, and the daily bar the page used to draw hid that entirely.
    #
    # Offsetting is a mitigation, not a fix. The schedule event has no
    # guarantee behind it at all, which is why probe.mjs now takes several
    # samples per run: what the scheduler does honour should at least be worth
    # more than one measurement. If this stays this unreliable the trigger has
    # to move off GitHub.
    # Disabled 2026-08-07. The probe and the page moved to segmentic-watchdog,
    # a second machine of ours in a different Arvan datacentre, and
    # status.segmentic.net is now an A record pointing there rather than a
    # CNAME to Pages.
    #
    # Two reasons, both measured rather than felt. The Actions minutes ran out,
    # 2108 of 2000 in six days, so this schedule was competing with the deploys
    # for a budget that had already gone. And the comment above is the other:
    # one run in three and a half hours from a cron asking for one every ten
    # minutes. A systemd timer on our own box fires on the wall clock.
    #
    # The independence that made GitHub the right home in the first place is
    # intact: the watchdog is not a machine this page reports on.
    #
    # Left here rather than deleted so the history and the reasoning stay
    # together, and so this is one line to restore if the watchdog is ever the
    # wrong place for it.
    # - cron: "3,13,23,33,43,53 * * * *"
  # For running it by hand after changing the probe or the page.
  workflow_dispatch:
  # A change to the page itself should show up without waiting for the next
  # tick. history.json is excluded because the workflow writes it, and a run
  # that triggers itself is a loop.
  push:
    branches: [main]
    paths:
      - index.html
      - probe.mjs
      - .github/workflows/probe.yml

permissions:
  # write, because history.json is committed back to this branch. It is the
  # only thing this workflow writes.
  contents: write
  pages: write
  id-token: write

# One run at a time, and later runs win.
#
# Not cancel-in-progress: a probe that is cancelled halfway has already made
# its measurements and would lose them, which puts a false gap in the history
# that reads as an outage.
concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    # The probe now spends five minutes sampling, and a run that hangs holds
    # the concurrency group above. Without a ceiling that wait is six hours,
    # which would silence the page for the rest of the day.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Probe
        run: node probe.mjs

      - name: Keep the history
        run: |
          set -euo pipefail
          git config user.name "segmentic-status"
          git config user.email "status@segmentic.net"

          # Three attempts, because the loser of a race has to measure again
          # rather than merge.
          #
          # Rebasing is the obvious move here and it cannot work. Two runs that
          # both appended to history.json conflict in exactly the same place
          # every time, so a rebase retry fails as reliably as the push it was
          # meant to rescue. Instead the loser throws its own commit away,
          # takes whatever landed, and re-runs the probe on top of it.
          # Re-probing costs about a second, and the extra sample is a real
          # measurement rather than a duplicated one.
          for attempt in 1 2 3; do
            git add history.json
            # Nothing to commit is not a failure. It happens whenever a run
            # produces byte-identical output, which is rare but not an error.
            if git diff --cached --quiet; then
              echo "no change"
              exit 0
            fi
            git commit -q -m "status: $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "attempt ${attempt}: somebody pushed first, measuring again on top of it"
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            node probe.mjs
          done

          echo "could not publish the history after three attempts" >&2
          exit 1

      - name: Assemble the page
        run: |
          set -euo pipefail
          mkdir -p public
          cp index.html history.json CNAME public/
          # No Jekyll. Without this, Pages runs the whole directory through a
          # static site generator that ignores files beginning with an
          # underscore and would rewrite the HTML.
          touch public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publish:
    needs: probe
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
